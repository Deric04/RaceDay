
name: RaceDay CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify project documentation
        run: |
          test -f README.md
          test -f docs/ERD.md
          test -f docs/API-Endpoint-Plan.md
          test -s docs/RaceDay.sql

      - name: Restore dependencies
        run: dotnet restore RaceDay.Tests/RaceDay.Tests.csproj

      - name: Build API
        run: dotnet build RaceDay.Api/RaceDay.Api.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
       run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --logger "console;verbosity=detailed"
